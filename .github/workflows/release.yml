name: Release

on:
  push:
    tags:
      - "v*"           # e.g. v1.0.0, v1.2.3
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write      # required to create/update GitHub Releases

jobs:
  release:
    name: Build and release DMG
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Resolve version from tag
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"
          fi

      - name: Patch build script with tag version
        run: |
          sed -i '' "s/^VERSION=.*/VERSION=\"${{ steps.version.outputs.version }}\"/" scripts/build-app.sh
          sed -i '' "s/^BUILD_NUMBER=.*/BUILD_NUMBER=\"${GITHUB_RUN_NUMBER}\"/" scripts/build-app.sh
          grep -E "^(VERSION|BUILD_NUMBER)=" scripts/build-app.sh

      - name: Build .app
        run: ./scripts/build-app.sh

      # ------------------------------------------------------------------
      # Optional: Developer ID signing + Apple notarization.
      # These steps only run when the required secrets are configured on
      # the repository. Without them, the DMG ships ad-hoc-signed and
      # users must right-click → Open once to bypass Gatekeeper.
      # ------------------------------------------------------------------
      - name: Import Developer ID certificate
        if: env.DEVELOPER_ID_CERT_P12_BASE64 != ''
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-temp-password
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/build.keychain-db"
          echo "$DEVELOPER_ID_CERT_P12_BASE64" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "${RUNNER_TEMP}/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

      - name: Sign & notarize
        if: env.DEVELOPER_ID_APPLICATION != ''
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/sign-notarize.sh

      # ------------------------------------------------------------------
      # DMG packaging + release upload
      # ------------------------------------------------------------------
      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-dmg.sh

      - name: List artifacts
        run: ls -lah build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiTimeBar-${{ steps.version.outputs.version }}
          path: |
            build/MultiTimeBar-*.dmg
            build/MultiTimeBar-*.dmg.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MultiTimeBar ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## MultiTimeBar ${{ steps.version.outputs.version }}

            Free, open source, native macOS menu bar app for tracking multiple time zones.
            Requires macOS 13 Ventura or later.

            ### Install

            1. Download `MultiTimeBar-${{ steps.version.outputs.version }}.dmg` below.
            2. Open the DMG and drag `MultiTimeBar.app` into your **Applications** folder.

            ### First launch (⚠️ important)

            Because this build is not notarized by Apple, macOS will show a
            "cannot verify that MultiTimeBar is free of malware" warning the first
            time you open it. This is expected for open source apps distributed
            without a paid Apple Developer certificate.

            To open the app the first time, choose **one** of the following:

            **Right-click → Open** (recommended)
            > In `/Applications`, right-click (or Control-click) `MultiTimeBar.app`
            > → **Open** → click **Open** in the dialog. macOS remembers the
            > choice; from then on double-click works normally.

            **System Settings**
            > After the warning appears, open **System Settings → Privacy & Security**
            > → click **Open Anyway** next to the MultiTimeBar entry.

            **Terminal**
            > ```sh
            > xattr -dr com.apple.quarantine /Applications/MultiTimeBar.app
            > ```

            ### Verify integrity

            Compare `MultiTimeBar-${{ steps.version.outputs.version }}.dmg.sha256`
            against the DMG:

            ```sh
            shasum -a 256 MultiTimeBar-${{ steps.version.outputs.version }}.dmg
            ```
          files: |
            build/MultiTimeBar-*.dmg
            build/MultiTimeBar-*.dmg.sha256
